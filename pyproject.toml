[project]
name = "tesina-andres-alasia"
version = "0.2.0"
description = "Modelos interatómicos y selección de hiperparámetros para la tesina de Licenciatura en Física."
authors = [{name = "Andrés Alasia"}]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "uf3==0.4.0",
    "ase>=3.22,<4",
    # UF3 utiliza matplotlib.cm.get_cmap, eliminado en Matplotlib 3.9.
    "matplotlib>=3.7,<3.9",
    "ndsplines>=0.2,<0.3",
    "numba>=0.59,<0.61",
    "numpy>=1.26,<2",
    "pandas>=1.5,<3",
    "plotly>=5,<6",
    "PyYAML>=6,<7",
    "scikit-learn>=1.3,<2",
    "scipy>=1.11,<1.14",
    "tables>=3.9,<4",
    "pyprojroot>=0.3,<0.4",
    "tqdm>=4,<5",
    # Conserva los getters/setters antiguos utilizados por UF3.
    "phonopy==2.38.2",
    "seekpath>=2,<3",
    "spglib>=2,<3",
]

[project.scripts]
tesina = "tesina.cli:main"

[project.optional-dependencies]
elastic-constants = ["elastic>=5,<6"]

[tool.poetry]
packages = [{include = "src"}, {include = "tesina"}]
requires-poetry = ">=2.0"
include = [
    {path = "configs", format = "sdist"},
    {path = "scripts", format = "sdist"},
    {path = "tests", format = "sdist"},
    {path = "docs", format = "sdist"},
]

[tool.poetry.group.notebooks.dependencies]
ipykernel = ">=6,<7"
jupyterlab = ">=4,<5"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
